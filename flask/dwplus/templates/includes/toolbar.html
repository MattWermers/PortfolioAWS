<div id="toolbar">
    <div class="file-meta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 4h10l6 6v10H4z" />
            <path d="M14 4v6h6" />
        </svg>
        <span class="file-name" id="fileName">-</span>
        <span class="file-rows" id="fileRows">-</span>
    </div>
    <div class="progress-badge" id="progressBadge">0 of 0 columns mapped</div>
    <div class="toolbar-actions">
        <button class="btn" id="resetBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7" />
                <path d="M3 4v5h5" />
            </svg>
            Start over
        </button>
        <button class="btn primary" id="exportBtn" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 3v13" />
                <path d="M6 11l6 6 6-6" />
                <path d="M4 21h16" />
            </svg>
            Export mapping
        </button>
        <button class="btn primary" id="submitBackendBtn" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 3v13" />
                <path d="M6 10l6-6 6 6" />
                <path d="M4 20h16" />
            </svg>
            Submit to Backend
        </button>
    </div>
</div>
