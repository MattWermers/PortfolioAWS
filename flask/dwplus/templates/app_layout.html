{% extends 'base.html' %}

{% block title %}DWPlus - Import{% endblock %}

{% block extra_css %}

    <!-- Mapper-specific styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/objects/dropzone.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/objects/stats_panel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/objects/toolbar.css') }}">

    <script src="{{ url_for('static', filename='scripts/import-pipeline.js') }}"></script>
