<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DWPlus{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Global styles (always loaded) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/objects/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/objects/button.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/objects/footer.css') }}">

    <!-- Page-specific styles -->
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="wrap">
        {% include 'includes/header.html' %}

        {% block content %}{% endblock %}

        {% include 'includes/footer.html' %}
    </div>

    <!-- Page-specific scripts -->
    {% block scripts %}{% endblock %}
</body>

</html>
